ckground:#292a2f;border:1px solid #ffffff24;padding:12px 17px;border-radius:4px;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pulse{50%{box-shadow:0 0 25px #d5283566;transform:scale(1.03)}}@keyframes selectPop{50%{transform:scale(1.04)}}@media(max-width:780px){.shell{padding:18px 16px 35px}.layout{grid-template-columns:1fr}.stamp{right:2%;top:0;font-size:9px}.hero{padding-top:48px}.join-panel{align-items:flex-start}.qr-frame{min-width:112px;min-height:112px}.qr-frame img,.qr-frame canvas{max-width:110px!important;max-height:110px!important}}@media(max-width:410px){.character-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.character{padding:5px 4px 7px}.character-name{font-size:10px}.character-role{font-size:8px}.phone-shell{padding:13px 12px 28px}.phone-answers{gap:8px}.phone-answer{min-height:91px;padding:10px}.phone-answer .answer-text{font-size:12px}.join-panel{gap:12px}.qr-frame{min-width:98px;min-height:98px}.qr-frame img,.qr-frame canvas{max-width:96px!important;max-height:96px!important}}

<body><main id="app"></main><div class="toast" id="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
// Dexter: The Ultimate Quiz Show — host-authoritative, peer-to-peer quiz in one HTML file.
const CHARACTERS=[
 {id:'dexter',name:'Dexter Morgan',role:'Blood spatter analyst',wiki:'Michael C. Hall'},
 {id:'debra',name:'Debra Morgan',role:'Miami Metro detective',wiki:'Jennifer Carpenter'},
 {id:'rita',name:'Rita Bennett',role:'Dexter’s wife',wiki:'Julie Benz'},
 {id:'angel',name:'Angel Batista',role:'Miami Metro sergeant',wiki:'David Zayas'},
 {id:'masuka',name:'Vince Masuka',role:'Forensic analyst',wiki:'C. S. Lee'},
 {id:'maria',name:'Maria LaGuerta',role:'Police lieutenant',wiki:'Lauren Vélez'},
 {id:'harry',name:'Harry Morgan',role:'Adoptive father',wiki:'James Remar'},
 {id:'doakes',name:'James Doakes',role:'Sergeant, homicide',wiki:'Erik King'}
];
const QUESTIONS=[
 {q:'At Miami Metro, what is Dexter Morgan’s official specialty?',a:['Latent fingerprint analysis','Bloodstain pattern analysis','Ballistics examination','Forensic entomology'],c:1},
 {q:'What name does Dexter give to the rules Harry taught him for controlling his violent urges?',a:['The Miami Protocol','The Morgan Method','The Code of Harry','The Dark Passenger’s Law'],c:2},
 {q:'Which three children does Rita bring into her family with Dexter?',a:['Astor, Cody and Harrison','Lumen, Cody and Astor','Harrison, Aimee and Cody','Astor, Harrison and Nicholas'],c:0},
 {q:'Who is the Ice Truck Killer, revealed to be Dexter’s biological older brother?',a:['Frank Lundy','Brian Moser','Miguel Prado','Arthur Mitchell'],c:1},
 {q:'What nickname does the press give the serial killer Dexter investigates in season 2?',a:['The Skinner','The Bay Harbor Butcher','The Barrel Girl Killer','The Trinity Killer'],c:1},
 {q:'What is Miguel Prado’s job when he first meets Dexter?',a:['Assistant district attorney','Medical examiner','FBI profiler','Police captain'],c:0},
 {q:'What is the real name of the family man known as the Trinity Killer?',a:['Walter Kenney','Arthur Mitchell','Elliot Larson','Jonah Vogel'],c:1},
 {q:'In season 5, which survivor of the Barrel Girl murders joins Dexter in seeking revenge?',a:['Lumen Pierce','Hannah McKay','Sonya', 'Nadia'],c:0},
 {q:'How does Lila Tournay kill Sergeant Doakes after discovering him at the cabin?',a:['She poisons his water','She shoots him during an escape','She blows up the cabin with him inside','She stages a car crash'],c:2},
 {q:'Where does Debra discover Dexter killing Travis Marshall in the season 6 finale?',a:['An abandoned airport hangar','A church','The Miami Metro evidence room','A shipping container'],c:1},
 {q:'Why does Ukrainian mob boss Isaak Sirko target Dexter in season 7?',a:['Dexter killed his lover, Viktor Baskov','Dexter framed him for the Bay Harbor murders','Dexter killed his brother, George','Dexter stole a shipment of narcotics'],c:0},
 {q:'Before becoming Dexter’s girlfriend, Hannah McKay was convicted as an accomplice in what?',a:['A string of poisonings with Wayne Randall','A series of arson attacks with Oliver Saxon','A bank robbery with Lila','The Barrel Girl murders'],c:0},
 {q:'Who is the “Brain Surgeon,” the season 8 killer also known as Daniel Vogel?',a:['Zach Hamilton','Oliver Saxon','Yates','Ron Galuzzo'],c:1},
 {q:'In the original series finale, what does Dexter do with Debra after she dies in hospital?',a:['He buries her beside Harry','He leaves her in the hospital chapel','He takes her body out to sea and releases it','He asks Batista to arrange her burial'],c:2},
 {q:'In New Blood’s finale, who shoots Dexter after Dexter asks to be killed?',a:['Angela Bishop','Harrison Morgan','Kurt Caldwell','Audrey Bishop'],c:1}
];
const app=document.getElementById('app');let peer=null,hostConns=new Map(),phoneConn=null,hostId='',role=new URLSearchParams(location.search).has('join')?'phone':'host';
let selectedCharacter=CHARACTERS[0].id,playerName='',playerId='',hostPlayers={},game={phase:'lobby',questionIndex:-1,deadline:0,answers:{},lastResult:null};let ticker=null,portraitCache={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function char(id){return CHARACTERS.find(x=>x.id===id)||CHARACTERS[0]}
function showToast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
function send(conn,type,payload){if(conn&&conn.open)conn.send({type,payload})}
function hostBroadcast(type,payload){for(const c of hostConns.values())send(c,type,payload)}
function portraitSrc(id){return portraitCache[id]||''}
function avatar(id,cls='player-avatar'){let c=char(id),src=portraitSrc(id);return `<img class="${cls}" src="${src}" alt="${esc(c.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="${cls} avatar-fallback" style="display:${src?'none':'grid'}">${esc(c.name.split(' ').map(x=>x[0]).join(''))}</span>`}
async function loadPortraits(){for(const c of CHARACTERS){try{let r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(c.wiki));if(r.ok){let d=await r.json();if(d.thumbnail?.source){portraitCache[c.id]=d.thumbnail.source;document.querySelectorAll(`[data-char-image="${c.id}"]`).forEach(i=>i.src=d.thumbnail.source);render()}}}catch(_){/* initials remain as a graceful offline fallback */}}}
function initPeer(isHost){if(typeof Peer==='undefined'){setStatus('disconnected');showToast('PeerJS could not load. Check your connection.');return}if(peer){try{peer.destroy()}catch(_){}}setStatus(isHost?'waiting':'waiting');peer=new Peer();peer.on('open',id=>{if(isHost){hostId=id;renderHost()}else connectPhone()});peer.on('connection',conn=>{if(!isHost)return;hostConns.set(conn.peer,conn);conn.on('data',msg=>handleHostMessage(conn,msg));conn.on('close',()=>{hostConns.delete(conn.peer);delete hostPlayers[conn.peer];hostBroadcast('PLAYERS',hostPlayers);renderHost();if(!hostConns.size)setStatus('waiting')});conn.on('error',()=>{hostConns.delete(conn.peer);delete hostPlayers[conn.peer];renderHost()})});peer.on('disconnected',()=>{setStatus('disconnected')});peer.on('error',e=>{console.warn(e);setStatus('disconnected');if(isHost)showToast('Connection issue. Use Reconnect to reopen the room.')});}
function setStatus(s){document.querySelectorAll('.status').forEach(el=>{el.className='status '+(s==='connected'?'connected':s==='disconnected'?'disconnected':'');let txt=el.querySelector('.status-text');if(txt)txt.textContent=s})}
function connectPhone(){let target=new URLSearchParams(location.search).get('join');if(!target)return;hostId=target;try{phoneConn=peer.connect(target,{reliable:true});phoneConn.on('open',()=>{setStatus('connected');send(phoneConn,'JOIN',{name:playerName,character:selectedCharacter,playerId:playerId||null});playerId=phoneConn.peer;renderPhone()});phoneConn.on('data',handlePhoneMessage);phoneConn.on('close',()=>{setStatus('disconnected');renderPhone()});phoneConn.on('error',()=>{setStatus('disconnected');renderPhone()})}catch(e){setStatus('disconnected')}}
function handleHostMessage(conn,msg){if(!msg||!msg.type)return;let p=msg.payload||{};if(msg.type==='JOIN'){if(game.phase!=='lobby'){send(conn,'LOCKED',{});return}hostPlayers[conn.peer]={id:conn.peer,name:String(p.name||'Agent').slice(0,20),character:char(p.character).id,score:0,correct:0,wrong:0,answered:0};send(conn,'WELCOME',{playerId:conn.peer,players:hostPlayers,state:publicState()});hostBroadcast('PLAYERS',hostPlayers);renderHost()}else if(msg.type==='ANSWER'){let id=conn.peer;if(game.phase!=='answering'||game.answers[id]||!hostPlayers[id])return;let choice=Number(p.choice);if(!Number.isInteger(choice)||choice<0||choice>3)return;let elapsed=Math.max(0,game.deadline-Date.now()),points=choice===QUESTIONS[game.questionIndex].c?Math.max(500,Math.floor(500*elapsed/45000)):0;game.answers[id]={choice,correct:points>0,points};hostPlayers[id].answered++;if(points){hostPlayers[id].score+=points;hostPlayers[id].correct++}else hostPlayers[id].wrong++;send(conn,'ANSWER_ACK',{choice});hostBroadcast('PLAYERS',hostPlayers);renderHost()}}
function publicState(){return {phase:game.phase,questionIndex:game.questionIndex,deadline:game.deadline,question:game.questionIndex>=0?QUESTIONS[game.questionIndex]:null,result:game.lastResult}}
function handlePhoneMessage(msg){if(!msg)return;let p=msg.payload||{};if(msg.type==='WELCOME'){playerId=p.playerId;hostPlayers=p.players||{};game={...game,...(p.state||{})};renderPhone()}else if(msg.type==='PLAYERS'){hostPlayers=p;renderPhone()}else if(msg.type==='STATE'){game={...game,...p};renderPhone()}else if(msg.type==='RESULT'){game.phase='result';game.lastResult=p;hostPlayers=p.players||hostPlayers;renderPhone()}else if(msg.type==='LOCKED'){showToast('This investigation has already started.');renderPhone(true)}else if(msg.type==='ANSWER_ACK'){phoneAnswered=true;renderPhone()}}
let phoneAnswered=false;
function makeQuestionState(){return {phase:game.phase,questionIndex:game.questionIndex,deadline:game.deadline,question:QUESTIONS[game.questionIndex],result:game.lastResult}}
function startQuestion(){game.questionIndex++;if(game.questionIndex>=QUESTIONS.length){finishGame();return}game.phase='reading';game.answers={};game.deadline=Date.now()+10000;game.lastResult=null;hostBroadcast('STATE',makeQuestionState());renderHost();setTimeout(()=>{if(game.phase!=='reading')return;game.phase='answering';game.deadline=Date.now()+45000;hostBroadcast('STATE',makeQuestionState());renderHost();setTimeout(()=>{if(game.phase==='answering')reveal()},45000)},10000)}
function reveal(){let q=QUESTIONS[game.questionIndex],correct=Object.values(game.answers).filter(a=>a.correct).length,wrong=Object.values(game.answers).filter(a=>!a.correct).length,unanswered=Math.max(0,Object.keys(hostPlayers).length-correct-wrong);game.phase='result';game.deadline=Date.now()+10000;game.lastResult={correctIndex:q.c,correct,wrong,unanswered,answers:game.answers,players:hostPlayers};hostBroadcast('RESULT',game.lastResult);renderHost();setTimeout(()=>{if(game.phase==='result')startQuestion()},10000)}
function finishGame(){game.phase='ended';game.deadline=0;hostBroadcast('STATE',publicState());renderHost()}
function ranking(){return Object.values(hostPlayers).sort((a,b)=>b.score-a.score||b.correct-a.correct||a.name.localeCompare(b.name))}
function renderHost(){if(role!=='host')return;let rank=ranking(),q=QUESTIONS[game.questionIndex],status=game.phase;app.innerHTML=`<div class="shell"><div class="topbar"><div class="brand"><div class="brand-mark"><span>D</span></div> Miami Metro · Investigation HQ</div><div class="status"><i class="dot"></i><span class="status-text">${hostConns.size?'connected':'waiting'}</span></div></div>${status==='lobby'?`<header class="hero"><div class="eyebrow">A Miami Metro special investigation</div><h1>Dexter: The<br><em>Ultimate Quiz Show</em></h1><div class="subtitle">15 cases. One sharp mind. No loose ends.</div><div class="stamp">CLASSIFIED<br>CASE FILE 01–15</div></header><div class="layout"><section class="card"><div class="card-head"><h2>Secure player access</h2><span class="mono">01 / Join the investigation</span></div><div class="card-body"><div class="join-panel"><div class="qr-frame" id="qr"></div><div class="join-copy"><h3>Scan to enter</h3><div class="mono">Choose your character. Enter your name.</div><div class="peer-code">Room ID · ${esc(hostId||'Connecting to secure line…')}</div><div class="mono">Players connected: <b style="color:#fff">${rank.length}</b></div></div></div><div class="facts"><span class="fact">15 <b>case files</b></span><span class="fact">45 sec <b>answer window</b></span><span class="fact">Up to <b>1,000 pts</b></span></div><div class="host-actions" style="margin-top:22px"><button class="btn btn-primary" id="start" ${rank.length?'':'disabled'}>Start Investigation</button><button class="btn btn-secondary" id="reconnect">Reconnect</button></div></div></section><section class="card"><div class="card-head"><h2>Persons of interest</h2><span class="mono">${rank.length} logged</span></div><div class="card-body"><div class="players">${rank.length?rank.map(p=>`<div class="player-row">${avatar(p.character)}<div class="player-meta"><div class="player-name">${esc(p.name)}</div><div class="player-character">${esc(char(p.character).name)}</div></div><span class="mono">READY</span></div>`).join(''):'<div class="empty-state">No players on the board yet.<br>Scan the QR code to join.</div>'}</div></div></section></div>`:status==='ended'?renderFinal(rank):`<section class="card host-game"><div class="card-head"><h2>${status==='result'?'Case findings':'Active case'}</h2><span class="case-label">CASE ${String(game.questionIndex+1).padStart(2,'0')} / 15</span></div><div class="card-body">${status==='result'?renderHostResult(q):`<div class="game-topline"><span class="mono">${status==='reading'?'Review the evidence':'Submit your finding'}</span><span class="timer" data-countdown>${Math.max(0,Math.ceil((game.deadline-Date.now())/1000))}</span></div><div class="progress-track"><span style="width:${status==='reading'?'100%':'100%'}"></span></div><h2 class="question">${esc(q.q)}</h2>${status==='answering'?`<div class="answers">${q.a.map((a,i)=>`<div class="answer-card"><span class="answer-letter">${'ABCD'[i]}</span><span class="answer-text">${esc(a)}</span><span class="mono" style="margin-left:auto">${Object.values(game.answers).filter(x=>x.choice===i).length||''}</span></div>`).join('')}</div>`:'<div class="empty-state">Read the case carefully. Response options will be released shortly.</div>'}<div class="resultbar"><span class="metric">Agents <b>${Object.keys(hostPlayers).length}</b></span><span class="metric">Responses <b>${Object.keys(game.answers).length}</b></span><span class="metric">Current leader <b>${esc(rank[0]?.name||'—')}</b></span></div></div></section><div class="layout" style="margin-top:18px"><section class="card"><div class="card-head"><h2>Suspect ranking</h2><span class="mono">Updated live</span></div><div class="card-body"><div class="leaderboard">${rank.length?rank.map((p,i)=>`<div class="rank-row"><span class="rank-num">${String(i+1).padStart(2,'0')}</span>${avatar(p.character)}<div class="player-meta"><div class="player-name">${esc(p.name)}</div><div class="player-character">${esc(char(p.character).name)}</div></div><span class="rank-points">${p.score.toLocaleString()} PTS</span></div>`).join(''):'<div class="empty-state">Awaiting player files.</div>'}</div></div></section><section class="card"><div class="card-head"><h2>Investigation log</h2><span class="mono">Evidence</span></div><div class="card-body"><div class="mono" style="line-height:2">Correct answers earn 500–1,000 points.<br>Speed bonus rewards quick decisions.<br>One answer per case. No revisions.<br>Unanswered cases score zero.</div></div></section></div>`}</div>`;if(status==='lobby'){if(hostId&&window.QRCode){let url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('join',hostId);new QRCode(document.getElementById('qr'),{text:url.href,width:130,height:130,colorDark:'#151515',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}document.getElementById('start')?.addEventListener('click',()=>{if(!rank.length)return;game={phase:'lobby',questionIndex:-1,deadline:0,answers:{},lastResult:null};hostBroadcast('STATE',publicState());startQuestion()});document.getElementById('reconnect')?.addEventListener('click',()=>initPeer(true))}else startTicker()}
function renderHostResult(q){let r=game.lastResult||{},choices=Object.values(r.answers||{});return `<div class="game-topline"><span class="case-label">Correct finding</span><span class="timer">${q?String.fromCharCode(65+q.c):''}</span></div><h2 class="question">${esc(q?.q||'')}</h2><div class="answers">${q?.a.map((a,i)=>`<div class="answer-card ${i===q.c?'correct':''}"><span class="answer-letter">${'ABCD'[i]}</span><span class="answer-text">${esc(a)}</span></div>`).join('')}</div><div class="resultbar"><span class="metric">Correct <b>${r.correct||0}</b></span><span class="metric">Incorrect <b>${r.wrong||0}</b></span><span class="metric">No response <b>${r.unanswered||0}</b></span></div><p class="result-note">Next case opens in <b data-countdown>10</b> seconds. Scores are updated on the suspect board.</p>`}
function renderFinal(rank){let top=rank.slice(0,3);return `<header class="hero"><div class="eyebrow">Investigation closed · Miami Metro</div><h1>Case<br><em>Concluded</em></h1><div class="subtitle">Final suspect ranking · ${rank.length} participants · 15 cases reviewed</div><div class="stamp">EVIDENCE<br>SEALED</div></header><section class="card"><div class="card-head"><h2>Final investigation report</h2><span class="mono">CLASSIFIED · FINAL</span></div><div class="card-body"><div class="podium">${top.length?top.map((p,i)=>`<div class="podium-card">${avatar(p.character)}<div class="place">${['1st place','2nd place','3rd place'][i]}</div><div class="podium-name">${esc(p.name)}</div><div class="mono">${p.score.toLocaleString()} pts</div></div>`).join(''):'<div class="empty-state">No players completed the investigation.</div>'}</div><div class="final-report"><div class="report-title">Full suspect ranking</div><div class="leaderboard" style="margin-top:12px">${rank.map((p,i)=>`<div class="rank-row"><span class="rank-num">${String(i+1).padStart(2,'0')}</span>${avatar(p.character)}<div class="player-meta"><div class="player-name">${esc(p.name)}</div><div class="player-character">${esc(char(p.character).name)} · ${p.correct} correct / ${p.wrong} incorrect</div></div><span class="rank-points">${p.score.toLocaleString()} PTS</span></div>`).join('')}</div></div><div class="host-actions" style="margin-top:22px"><button class="btn btn-secondary" id="new-game">Open a new investigation</button></div></div></section>`}
function renderPhone(locked=false){if(role!=='phone')return;let phase=game.phase,q=game.questionIndex>=0?QUESTIONS[game.questionIndex]:null;let statusText=phoneConn?.open?'connected':phoneConn?'disconnected':'waiting';if(locked)phase='locked';app.innerHTML=`<div class="phone-shell"><div class="topbar"><div class="brand"><div class="brand-mark"><span>D</span></div> Miami Metro</div><div class="status ${statusText}"><i class="dot"></i><span class="status-text">${statusText}</span></div></div>${phase==='setup'?phoneSetup():phase==='lobby'?`<header class="hero"><div class="eyebrow">Secure line established</div><h1>Dexter:<br><em>Quiz Show</em></h1></header><section class="card"><div class="phone-wait"><div class="waiting-mark">D</div><div class="mono">Agent · ${esc(playerName)} / ${esc(char(selectedCharacter).name)}</div><h2>Awaiting briefing</h2><p class="small-muted">The host will begin the investigation shortly.<br>Keep this screen open.</p><div style="margin:20px auto">${avatar(selectedCharacter,'player-avatar')}</div><button class="btn btn-secondary" id="phone-reconnect">Reconnect</button></div></section>`:phase==='reading'||phase==='answering'?`<section class="card"><div class="card-head"><h2>Case file ${String(game.questionIndex+1).padStart(2,'0')}</h2><span class="mono">${phase==='reading'?'Review':'Open'}</span></div><div class="card-body"><div class="game-topline"><span class="case-label">Miami Metro · Evidence review</span><span class="timer" data-countdown>${Math.max(0,Math.ceil((game.deadline-Date.now())/1000))}</span></div><div class="progress-track"><span></span></div><div class="phone-question">${esc(q?.q||'')}</div>${phase==='reading'?'<div class="phone-msg">Read the case. Four possible findings will appear when the briefing ends.</div>':`<div class="phone-answers">${q.a.map((a,i)=>`<button class="phone-answer" data-choice="${i}" ${phoneAnswered?'disabled':''}><span class="answer-letter">${'ABCD'[i]}</span><span class="answer-text">${esc(a)}</span></button>`).join('')}</div><div class="phone-msg" id="answer-msg">${phoneAnswered?'Finding submitted. Stand by for the case result.':'Select one answer. Your finding cannot be changed.'}</div>`}</div></section>`:phase==='result'?`<section class="card"><div class="card-head"><h2>Case ${String(game.questionIndex+1).padStart(2,'0')} · Closed</h2><span class="mono">Finding</span></div><div class="phone-result"><div class="waiting-mark" style="color:${game.lastResult?.answers?.[playerId]?.correct?'var(--green)':'var(--red2)'}">${game.lastResult?.answers?.[playerId]?.correct?'✓':'×'}</div><h2>${game.lastResult?.answers?.[playerId]?.correct?'Correct finding':'Case resolved'}</h2><div class="small-muted">${esc(QUESTIONS[game.questionIndex]?.a[game.lastResult?.correctIndex]||'')}</div><div class="points-gain">+${game.lastResult?.answers?.[playerId]?.points||0}</div><div class="mono">points earned this case</div><p class="small-muted">Your running total: ${Number(hostPlayers[playerId]?.score||0).toLocaleString()} pts</p><p class="small-muted">Next file opens automatically.</p></div></section>`:phase==='ended'?`<section class="card"><div class="card-head"><h2>Investigation concluded</h2><span class="mono">Final report</span></div><div class="phone-result"><div class="eyebrow">Final suspect ranking</div><div class="place-big">${ordinal(ranking().findIndex(p=>p.id===playerId)+1)}</div><h2>${esc(playerName)}</h2><div class="points-gain">${Number(hostPlayers[playerId]?.score||0).toLocaleString()}</div><div class="mono">final points</div><p class="small-muted">${hostPlayers[playerId]?.correct||0} correct · ${hostPlayers[playerId]?.wrong||0} incorrect</p></div></section>`:`<section class="card"><div class="phone-wait"><h2>Investigation unavailable</h2><p class="small-muted">This room has already started or closed.</p><button class="btn btn-secondary" id="phone-reconnect">Reconnect</button></div></section>`}</div>`;document.getElementById('phone-reconnect')?.addEventListener('click',()=>initPeer(false));document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{if(phoneAnswered)return;phoneAnswered=true;b.classList.add('selected');document.querySelectorAll('[data-choice]').forEach(x=>x.disabled=true);send(phoneConn,'ANSWER',{choice:Number(b.dataset.choice)});let m=document.getElementById('answer-msg');if(m)m.textContent='Finding submitted. Stand by for the case result.'}));startTicker()}
function ordinal(n){if(n<1)return'—';return n+(n%100>=11&&n%100<=13?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'))}
function phoneSetup(){return `<header class="hero"><div class="eyebrow">Miami Metro · Agent intake</div><h1>Choose your<br><em>identity</em></h1><div class="subtitle">Select your character, then join the case.</div></header><section class="card"><div class="card-head"><h2>Character selection</h2><span class="mono">Select one</span></div><div class="card-body"><div class="character-grid">${CHARACTERS.map(c=>`<button type="button" class="character ${selectedCharacter===c.id?'selected':''}" data-character="${c.id}"><img class="portrait" data-char-image="${c.id}" src="${portraitSrc(c.id)}" alt="${esc(c.name)} portrait" onerror="this.style.opacity='.32'"><div class="character-name">${esc(c.name)}</div><div class="character-role">${esc(c.role)}</div></button>`).join('')}</div><label class="form-label" for="player-name">Agent name</label><input id="player-name" class="text-input" maxlength="20" autocomplete="nickname" placeholder="Enter your username" value="${esc(playerName)}"><div class="enter-row"><button class="btn btn-primary" id="join-game">Enter the investigation</button></div><p class="small-muted" style="text-align:center;margin:14px 0 0">You can’t change your character after joining.</p></div></section>`}
function renderSetup(){app.innerHTML=`<div class="phone-shell"><div class="topbar"><div class="brand"><div class="brand-mark"><span>D</span></div> Miami Metro</div><div class="status"><i class="dot"></i><span class="status-text">waiting</span></div></div>${phoneSetup()}</div>`;document.querySelectorAll('[data-character]').forEach(b=>b.addEventListener('click',()=>{selectedCharacter=b.dataset.character;renderSetup()}));document.getElementById('join-game').addEventListener('click',()=>{let n=document.getElementById('player-name').value.trim();if(!n){showToast('Enter an agent name to continue.');return}playerName=n;localStorage.setItem('dexterQuizName',n);game.phase='lobby';renderPhone();initPeer(false)})}
function startTicker(){if(ticker)clearInterval(ticker);ticker=setInterval(()=>{let el=document.querySelector('[data-countdown]');if(!el)return;let remain=Math.max(0,Math.ceil((game.deadline-Date.now())/1000));el.textContent=remain;if(role==='phone'&&game.phase==='answering'){}},250)}
function render(){role==='host'?renderHost():renderPhone()}
if(role==='host'){renderHost();initPeer(true)}else{playerName=localStorage.getItem('dexterQuizName')||'';game.phase='setup';renderSetup();loadPortraits()}
// Start a clean lobby from the investigation report without reloading the document.
document.addEventListener('click',e=>{if(e.target.id==='new-game'){game={phase:'lobby',questionIndex:-1,deadline:0,answers:{},lastResult:null};hostPlayers={};hostConns.clear();initPeer(true)}});
</script></body></html>
